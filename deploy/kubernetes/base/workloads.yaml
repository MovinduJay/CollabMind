apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: collabmind
  labels: { app.kubernetes.io/name: web, app.kubernetes.io/part-of: collabmind }
spec:
  replicas: 2
  selector: { matchLabels: { app.kubernetes.io/name: web } }
  template:
    metadata: { labels: { app.kubernetes.io/name: web, app.kubernetes.io/part-of: collabmind } }
    spec:
      serviceAccountName: collabmind-runtime
      securityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: web
          image: ghcr.io/movindujay/collabmind-web:0.1.0
          ports: [{ name: http, containerPort: 8080 }]
          readinessProbe: { httpGet: { path: /healthz, port: http }, initialDelaySeconds: 2, periodSeconds: 5 }
          livenessProbe: { httpGet: { path: /healthz, port: http }, initialDelaySeconds: 10, periodSeconds: 10 }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 250m, memory: 128Mi }
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: [ALL] }, readOnlyRootFilesystem: true }
          volumeMounts: [{ name: nginx-cache, mountPath: /var/cache/nginx }, { name: nginx-run, mountPath: /var/run }]
      volumes: [{ name: nginx-cache, emptyDir: {} }, { name: nginx-run, emptyDir: {} }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: identity-service
  namespace: collabmind
  labels: { app.kubernetes.io/name: identity-service, app.kubernetes.io/part-of: collabmind }
spec:
  replicas: 2
  selector: { matchLabels: { app.kubernetes.io/name: identity-service } }
  template:
    metadata: { labels: { app.kubernetes.io/name: identity-service, app.kubernetes.io/part-of: collabmind } }
    spec:
      serviceAccountName: collabmind-runtime
      securityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: identity-service
          image: ghcr.io/movindujay/collabmind-identity-service:0.1.0
          ports: [{ name: http, containerPort: 8082 }]
          env:
            - { name: SPRING_DATASOURCE_URL, valueFrom: { secretKeyRef: { name: collabmind-secrets, key: identity-database-url } } }
            - { name: SPRING_DATASOURCE_USERNAME, valueFrom: { secretKeyRef: { name: collabmind-secrets, key: identity-database-username } } }
            - { name: SPRING_DATASOURCE_PASSWORD, valueFrom: { secretKeyRef: { name: collabmind-secrets, key: identity-database-password } } }
            - { name: APP_JWT_SECRET, valueFrom: { secretKeyRef: { name: collabmind-secrets, key: jwt-secret } } }
          envFrom: [{ configMapRef: { name: collabmind-config } }]
          readinessProbe: { httpGet: { path: /actuator/health/readiness, port: http }, initialDelaySeconds: 15, periodSeconds: 10, failureThreshold: 6 }
          livenessProbe: { httpGet: { path: /actuator/health/liveness, port: http }, initialDelaySeconds: 30, periodSeconds: 15 }
          resources: { requests: { cpu: 150m, memory: 256Mi }, limits: { cpu: "1", memory: 768Mi } }
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: [ALL] }, readOnlyRootFilesystem: true }
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
      volumes: [{ name: tmp, emptyDir: {} }]
---
