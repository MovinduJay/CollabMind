apiVersion: apps/v1
kind: Deployment
metadata:
  name: realtime-gateway
  namespace: collabmind
  labels: { app.kubernetes.io/name: realtime-gateway, app.kubernetes.io/part-of: collabmind }
spec:
  replicas: 3
  selector: { matchLabels: { app.kubernetes.io/name: realtime-gateway } }
  template:
    metadata: { labels: { app.kubernetes.io/name: realtime-gateway, app.kubernetes.io/part-of: collabmind } }
    spec:
      serviceAccountName: collabmind-runtime
      terminationGracePeriodSeconds: 45
      securityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: realtime-gateway
          image: ghcr.io/movindujay/collabmind-realtime-gateway:0.1.0
          ports: [{ name: http, containerPort: 8083 }]
          env:
            - { name: APP_JWT_SECRET, valueFrom: { secretKeyRef: { name: collabmind-secrets, key: jwt-secret } } }
          envFrom: [{ configMapRef: { name: collabmind-config } }]
          readinessProbe: { httpGet: { path: /actuator/health/readiness, port: http }, initialDelaySeconds: 15, periodSeconds: 10, failureThreshold: 6 }
          livenessProbe: { httpGet: { path: /actuator/health/liveness, port: http }, initialDelaySeconds: 30, periodSeconds: 15 }
          resources: { requests: { cpu: 150m, memory: 256Mi }, limits: { cpu: "1", memory: 768Mi } }
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: [ALL] }, readOnlyRootFilesystem: true }
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
      volumes: [{ name: tmp, emptyDir: {} }]
---
