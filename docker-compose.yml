services:
  postgres-chat-core:
    image: postgres:16
    container_name: collabmind-postgres-chat-core
    environment:
      POSTGRES_DB: collabmind_chat
      POSTGRES_USER: collabmind
      POSTGRES_PASSWORD: collabmind_dev_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_chat_core_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U collabmind -d collabmind_chat"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_chat_core_data:
