name: collabmind

services:
  redis:
    image: redis:7.4-alpine
    container_name: collabmind-redis
    command: redis-server --appendonly yes --maxmemory-policy noeviction
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    image: apache/kafka:3.8.0
    container_name: collabmind-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:29093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 20

  postgres-identity:
    image: postgres:16
    container_name: collabmind-postgres-identity
    environment:
      POSTGRES_DB: collabmind_identity
      POSTGRES_USER: ${POSTGRES_USER:-collabmind}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-collabmind_dev_password}
    ports:
      - "5434:5432"
    volumes:
      - postgres_identity_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-collabmind} -d collabmind_identity"]
      interval: 10s
      timeout: 5s
      retries: 10

  postgres-chat-core:
    image: postgres:16
    container_name: collabmind-postgres-chat-core
    environment:
      POSTGRES_DB: collabmind_chat
      POSTGRES_USER: ${POSTGRES_USER:-collabmind}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-collabmind_dev_password}
    ports:
      - "5433:5432"
    volumes:
      - postgres_chat_core_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-collabmind} -d collabmind_chat"]
      interval: 10s
      timeout: 5s
      retries: 10

  postgres-ai-orchestrator:
    image: postgres:16
    container_name: collabmind-postgres-ai-orchestrator
    environment:
      POSTGRES_DB: collabmind_ai
      POSTGRES_USER: ${POSTGRES_USER:-collabmind}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-collabmind_dev_password}
    ports:
      - "5435:5432"
    volumes:
      - postgres_ai_orchestrator_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-collabmind} -d collabmind_ai"]
      interval: 10s
      timeout: 5s
      retries: 10

  identity-service:
    container_name: collabmind-identity-service
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE_PATH: services/identity-service
        JAVA_VERSION: 23
    environment:
      SERVER_PORT: 8082
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-identity:5432/collabmind_identity
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-collabmind}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-collabmind_dev_password}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_FLYWAY_ENABLED: "false"
      SPRING_JPA_SHOW_SQL: "false"
      APP_JWT_SECRET: ${APP_JWT_SECRET:-collabmind-development-secret-key-change-this-later-123456789}
      APP_JWT_EXPIRATION_MINUTES: 1440
    ports:
      - "8082:8082"
    depends_on:
      postgres-identity:
        condition: service_healthy

  chat-core:
    container_name: collabmind-chat-core
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE_PATH: services/chat-core
        JAVA_VERSION: 23
    environment:
      SERVER_PORT: 8081
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-chat-core:5432/collabmind_chat
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-collabmind}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-collabmind_dev_password}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_FLYWAY_ENABLED: "false"
      SPRING_JPA_SHOW_SQL: "false"
      APP_JWT_SECRET: ${APP_JWT_SECRET:-collabmind-development-secret-key-change-this-later-123456789}
      REDIS_HOST: redis
      ROOM_TTL: ${ROOM_TTL:-PT24H}
    ports:
      - "8081:8081"
    depends_on:
      postgres-chat-core:
        condition: service_healthy
      identity-service:
        condition: service_started
      redis:
        condition: service_healthy

  ai-orchestrator:
    container_name: collabmind-ai-orchestrator
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE_PATH: services/ai-orchestrator
        JAVA_VERSION: 23
    environment:
      SERVER_PORT: 8084
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-ai-orchestrator:5432/collabmind_ai
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-collabmind}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-collabmind_dev_password}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_FLYWAY_ENABLED: "false"
      SPRING_JPA_SHOW_SQL: "false"
      COLLABMIND_AI_PROVIDER: ${COLLABMIND_AI_PROVIDER:-openai}
      COLLABMIND_AI_FALLBACK_PROVIDER: mock
      COLLABMIND_AI_FALLBACK_ENABLED: ${COLLABMIND_AI_FALLBACK_ENABLED:-false}
      COLLABMIND_TOOLS_SHOPPING_PROVIDER: mcp
      COLLABMIND_TOOLS_MCP_SHOPPING_BASE_URL: http://tool-mcp-server:8085
      COLLABMIND_TOOLS_GITHUB_PROVIDER: mcp
      COLLABMIND_TOOLS_MCP_GITHUB_BASE_URL: http://tool-mcp-server:8085
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5-nano}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    ports:
      - "8084:8084"
    depends_on:
      postgres-ai-orchestrator:
        condition: service_healthy
      tool-mcp-server:
        condition: service_started
      kafka:
        condition: service_healthy

  tool-mcp-server:
    container_name: collabmind-tool-mcp-server
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE_PATH: services/tool-mcp-server
        JAVA_VERSION: 23
    environment:
      SERVER_PORT: 8085
      COLLABMIND_GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8085:8085"

  realtime-gateway:
    container_name: collabmind-realtime-gateway
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE_PATH: services/realtime-gateway
        JAVA_VERSION: 23
    environment:
      SERVER_PORT: 8083
      COLLABMIND_CHAT_CORE_BASE_URL: http://chat-core:8081
      COLLABMIND_AI_ORCHESTRATOR_BASE_URL: http://ai-orchestrator:8084
      APP_JWT_SECRET: ${APP_JWT_SECRET:-collabmind-development-secret-key-change-this-later-123456789}
      REDIS_HOST: redis
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    ports:
      - "8083:8083"
    depends_on:
      chat-core:
        condition: service_started
      ai-orchestrator:
        condition: service_started
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy

volumes:
  postgres_identity_data:
  postgres_chat_core_data:
  postgres_ai_orchestrator_data:
  redis_data:
  kafka_data:



