version: 2
updates:
  - package-ecosystem: npm
    directory: /apps/web
    schedule: { interval: weekly }
    groups:
      frontend-dependencies: { patterns: ["*"] }
  - package-ecosystem: maven
    directory: /services/identity-service
    schedule: { interval: weekly }
  - package-ecosystem: maven
    directory: /services/chat-core
    schedule: { interval: weekly }
  - package-ecosystem: maven
    directory: /services/realtime-gateway
    schedule: { interval: weekly }
  - package-ecosystem: maven
    directory: /services/ai-orchestrator
    schedule: { interval: weekly }
  - package-ecosystem: maven
    directory: /services/tool-mcp-server
    schedule: { interval: weekly }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly }
