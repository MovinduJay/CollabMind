name: Backend CI

on:
  push:
    branches:
      - main
      - web-frontend
      - "feature/**"
  pull_request:
    branches:
      - main

jobs:
  build-backend-services:
    name: Build Backend Services
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        service:
          - identity-service
          - chat-core
          - ai-orchestrator
          - realtime-gateway
          - tool-mcp-server

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 23
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "23"
          cache: maven

      - name: Build ${{ matrix.service }}
        working-directory: services/${{ matrix.service }}
        run: mvn -B clean package

  frontend-tests:
    name: Frontend unit and browser tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run test:coverage
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- --project=chromium
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 14

  distributed-integration-tests:
    name: Redis and Kafka integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Run container-backed infrastructure tests
        working-directory: services/realtime-gateway
        run: mvn -B -Dtest=DistributedInfrastructureContainerTest test

