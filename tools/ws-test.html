<!DOCTYPE html>
<html>
<head>
    <title>CollabMind WebSocket Test</title>
</head>
<body>
<h2>CollabMind WebSocket Test</h2>

<p><strong>User ID:</strong> <span id="userId"></span></p>

<label>
    Conversation ID:
    <input id="conversationId" style="width: 360px;" placeholder="Paste conversation id here">
</label>

<br><br>

<label>
    Message:
    <input id="messageContent" style="width: 360px;" value="Hello from realtime-gateway">
</label>

<br><br>

<button onclick="sendPing()">Send PING</button>
<button onclick="sendBroadcast()">Send BROADCAST_TEST</button>
<button onclick="sendMessage()">Send Real Message</button>

<pre id="output"></pre>

<script>
    const output = document.getElementById("output");
    const userId = crypto.randomUUID();

    document.getElementById("userId").textContent = userId;

    const socket = new WebSocket(`ws://localhost:8083/ws/chat?userId=${userId}`);

    function log(message) {
        output.textContent += message + "\n";
        console.log(message);
    }

    socket.onopen = () => {
        log("Connected to realtime-gateway");

        socket.send(JSON.stringify({
            commandId: crypto.randomUUID(),
            commandType: "PING",
            conversationId: null,
            payload: {}
        }));
    };

    socket.onmessage = (event) => {
        log("Server event: " + event.data);
    };

    socket.onerror = (error) => {
        log("WebSocket error. Check if realtime-gateway is running on port 8083.");
        console.error(error);
    };

    socket.onclose = () => {
        log("Connection closed");
    };

    function sendPing() {
        socket.send(JSON.stringify({
            commandId: crypto.randomUUID(),
            commandType: "PING",
            conversationId: null,
            payload: {}
        }));
    }

    function sendBroadcast() {
        socket.send(JSON.stringify({
            commandId: crypto.randomUUID(),
            commandType: "BROADCAST_TEST",
            conversationId: "test-room",
            payload: {
                message: "Hello from CollabMind WebSocket test"
            }
        }));
    }

    function sendMessage() {
        const conversationId = document.getElementById("conversationId").value;
        const content = document.getElementById("messageContent").value;

        socket.send(JSON.stringify({
            commandId: crypto.randomUUID(),
            commandType: "SEND_MESSAGE",
            conversationId: conversationId,
            payload: {
                conversationId: conversationId,
                clientMessageId: crypto.randomUUID(),
                content: content
            }
        }));
    }
</script>
</body>
</html>
