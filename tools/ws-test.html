<!DOCTYPE html>
<html>
<head>
    <title>CollabMind WebSocket Test</title>
</head>
<body>
<h2>CollabMind WebSocket Test</h2>

<label>
    JWT Token:
    <input id="token" style="width: 760px;" placeholder="Paste JWT from identity-service here">
</label>

<button onclick="connect()">Connect</button>

<p><strong>Connected User ID:</strong> <span id="userId">Not connected</span></p>
<p><strong>Last Seen Sequence:</strong> <span id="lastSeenSequence">0</span></p>

<label>
    Conversation ID:
    <input id="conversationId" style="width: 420px;" placeholder="Paste conversation id here">
</label>

<br><br>

<label>
    Message:
    <input id="messageContent" style="width: 420px;" value="@planner help us break CollabMind into next tasks">
</label>

<br><br>

<label>
    Fetch after sequence:
    <input id="afterSequence" type="number" value="0" style="width: 80px;">
</label>

<br><br>

<button onclick="sendPing()">Send PING</button>
<button onclick="subscribeConversation()">Subscribe Conversation</button>
<button onclick="unsubscribeConversation()">Unsubscribe Conversation</button>
<button onclick="startTyping()">Start Typing</button>
<button onclick="stopTyping()">Stop Typing</button>
<button onclick="sendMessage()">Send Real Message</button>
<button onclick="fetchMessagesAfter()">Fetch Messages After</button>

<pre id="output"></pre>

<script>
    const output = document.getElementById("output");
    const userIdElement = document.getElementById("userId");
    const lastSeenSequenceElement = document.getElementById("lastSeenSequence");

    let socket = null;
    let lastSeenSequence = 0;

    function log(message) {
        output.textContent += message + "\n";
        console.log(message);
    }

    function connect() {
        const token = document.getElementById("token").value.trim();

        if (!token) {
            log("Please paste a JWT token first.");
            return;
        }

        socket = new WebSocket(`ws://localhost:8083/ws/chat?token=${encodeURIComponent(token)}`);

        socket.onopen = () => {
            log("Connected to realtime-gateway");
        };

        socket.onmessage = (event) => {
            log("Server event: " + event.data);

            const serverEvent = JSON.parse(event.data);

            if (serverEvent.eventType === "CONNECTED") {
                userIdElement.textContent = serverEvent.payload.userId;
            }

            if (
                serverEvent.eventType === "MESSAGE_CREATED" ||
                serverEvent.eventType === "AI_MESSAGE_CREATED"
            ) {
                updateLastSeenSequence(serverEvent.payload.message.sequenceNumber);
            }

            if (serverEvent.eventType === "MESSAGE_HISTORY") {
                const messages = serverEvent.payload.messages || [];

                for (const message of messages) {
                    updateLastSeenSequence(message.sequenceNumber);
                }
            }
        };

        socket.onerror = (error) => {
            log("WebSocket error. Check token and make sure realtime-gateway is running on port 8083.");
            console.error(error);
        };

        socket.onclose = (event) => {
            log("Connection closed");
            log("Close code: " + event.code);
            log("Close reason: " + event.reason);
        };
    }

    function updateLastSeenSequence(sequenceNumber) {
        if (sequenceNumber > lastSeenSequence) {
            lastSeenSequence = sequenceNumber;
            lastSeenSequenceElement.textContent = lastSeenSequence;
        }
    }

    function ensureConnected() {
        if (!socket || socket.readyState !== WebSocket.OPEN) {
            log("WebSocket is not connected.");
            return false;
        }

        return true;
    }

    function getConversationId() {
        return document.getElementById("conversationId").value.trim();
    }

    function sendPing() {
        if (!ensureConnected()) return;

        socket.send(JSON.stringify({
            commandId: crypto.randomUUID(),
            commandType: "PING",
            conversationId: null,
            payload: {}
        }));
    }

    function subscribeConversation() {
        if (!ensureConnected()) return;

        const conversationId = getConversationId();

        socket.send(JSON.stringify({
            commandId: crypto.randomUUID(),
            commandType: "SUBSCRIBE_CONVERSATION",
            conversationId: conversationId,
            payload: {}
        }));
    }

    function unsubscribeConversation() {
        if (!ensureConnected()) return;

        const conversationId = getConversationId();

        socket.send(JSON.stringify({
            commandId: crypto.randomUUID(),
            commandType: "UNSUBSCRIBE_CONVERSATION",
            conversationId: conversationId,
            payload: {}
        }));
    }

    function startTyping() {
        if (!ensureConnected()) return;

        const conversationId = getConversationId();

        socket.send(JSON.stringify({
            commandId: crypto.randomUUID(),
            commandType: "START_TYPING",
            conversationId: conversationId,
            payload: {}
        }));
    }

    function stopTyping() {
        if (!ensureConnected()) return;

        const conversationId = getConversationId();

        socket.send(JSON.stringify({
            commandId: crypto.randomUUID(),
            commandType: "STOP_TYPING",
            conversationId: conversationId,
            payload: {}
        }));
    }

    function sendMessage() {
        if (!ensureConnected()) return;

        const conversationId = getConversationId();
        const content = document.getElementById("messageContent").value;

        socket.send(JSON.stringify({
            commandId: crypto.randomUUID(),
            commandType: "SEND_MESSAGE",
            conversationId: conversationId,
            payload: {
                conversationId: conversationId,
                clientMessageId: crypto.randomUUID(),
                content: content
            }
        }));
    }

    function fetchMessagesAfter() {
        if (!ensureConnected()) return;

        const conversationId = getConversationId();
        const afterSequence = Number(document.getElementById("afterSequence").value);

        socket.send(JSON.stringify({
            commandId: crypto.randomUUID(),
            commandType: "FETCH_MESSAGES_AFTER",
            conversationId: conversationId,
            payload: {
                afterSequence: afterSequence,
                limit: 50
            }
        }));
    }
</script>
</body>
</html>
