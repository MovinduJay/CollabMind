spring.application.name=identity-service
server.port=8082


spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.h2.console.enabled=false

app.jwt.secret=collabmind-development-secret-key-change-this-later-123456789

management.endpoints.web.exposure.include=health,info
app.jwt.expiration-minutes=1440

spring.datasource.url=jdbc:postgresql://localhost:5432/collabmind_identity
spring.datasource.username=${IDENTITY_DB_USERNAME:postgres}
spring.datasource.password=${IDENTITY_DB_PASSWORD:change-me}
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.locations=classpath:db/migration









