spring.application.name=identity-service
server.port=8082

spring.datasource.url=jdbc:postgresql://${IDENTITY_DB_HOST:localhost}:${IDENTITY_DB_PORT:5434}/${IDENTITY_DB_NAME:collabmind_identity}
spring.datasource.username=${IDENTITY_DB_USERNAME:collabmind}
spring.datasource.password=${IDENTITY_DB_PASSWORD:collabmind_dev_password}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.h2.console.enabled=false

app.jwt.secret=collabmind-development-secret-key-change-this-later-123456789

management.endpoints.web.exposure.include=health,info
app.jwt.expiration-minutes=1440

