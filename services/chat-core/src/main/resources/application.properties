spring.application.name=chat-core
server.port=8081


spring.datasource.driver-class-name=org.postgresql.Driver


spring.datasource.url=jdbc:postgresql://localhost:5432/collabmind_chat
spring.datasource.username=${CHAT_DB_USERNAME:postgres}
spring.datasource.password=${CHAT_DB_PASSWORD:change-me}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.h2.console.enabled=false

app.jwt.secret=collabmind-development-secret-key-change-this-later-123456789

management.endpoints.web.exposure.include=health,info
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
collabmind.rooms.ttl=${ROOM_TTL:PT24H}
collabmind.rooms.expiry-scan-ms=${ROOM_EXPIRY_SCAN_MS:60000}
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.locations=classpath:db/migration









