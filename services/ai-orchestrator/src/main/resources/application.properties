spring.application.name=ai-orchestrator
server.port=8084

spring.datasource.url=jdbc:postgresql://${AI_DB_HOST:localhost}:${AI_DB_PORT:5435}/${AI_DB_NAME:collabmind_ai}
spring.datasource.username=${AI_DB_USERNAME:collabmind}
spring.datasource.password=${AI_DB_PASSWORD:collabmind_dev_password}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.h2.console.enabled=false

collabmind.ai.provider=mock
collabmind.ai.fallback-provider=mock
collabmind.ai.fallback-enabled=true

collabmind.ai.gemini.base-url=https://generativelanguage.googleapis.com
collabmind.ai.gemini.model=gemini-2.0-flash
collabmind.ai.gemini.api-key=${GEMINI_API_KEY:}

management.endpoints.web.exposure.include=health,info
