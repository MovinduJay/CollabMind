spring.application.name=ai-orchestrator

server.port=8084

management.endpoints.web.exposure.include=health,info
collabmind.ai.provider=gemini

spring.datasource.url=jdbc:h2:mem:collabmind_ai
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

collabmind.ai.gemini.base-url=https://generativelanguage.googleapis.com
collabmind.ai.gemini.model=gemini-2.0-flash
collabmind.ai.gemini.api-key=${GEMINI_API_KEY:}

