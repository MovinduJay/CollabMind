spring.application.name=ai-orchestrator
server.port=8084

spring.datasource.url=jdbc:postgresql://localhost:5432/collabmind_ai
spring.datasource.username=${AI_DB_USERNAME:postgres}
spring.datasource.password=${AI_DB_PASSWORD:change-me}
spring.datasource.driver-class-name=org.postgresql.Driver


spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.h2.console.enabled=false

collabmind.ai.provider=mock
collabmind.ai.fallback-provider=mock
collabmind.ai.fallback-enabled=true

collabmind.ai.gemini.base-url=https://generativelanguage.googleapis.com
collabmind.ai.gemini.model=gemini-2.0-flash
collabmind.ai.gemini.api-key=${GEMINI_API_KEY:}

management.endpoints.web.exposure.include=health,info
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1


