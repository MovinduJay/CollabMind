spring.application.name=ai-orchestrator
spring.config.import=optional:file:.env[.properties],optional:file:../../.env[.properties]
server.port=8084

spring.datasource.url=jdbc:postgresql://localhost:5432/collabmind_ai
spring.datasource.username=${AI_DB_USERNAME:postgres}
spring.datasource.password=${AI_DB_PASSWORD:change-me}
spring.datasource.driver-class-name=org.postgresql.Driver


spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.h2.console.enabled=false

collabmind.ai.provider=${COLLABMIND_AI_PROVIDER:mock}
collabmind.ai.fallback-provider=${COLLABMIND_AI_FALLBACK_PROVIDER:mock}
collabmind.ai.fallback-enabled=${COLLABMIND_AI_FALLBACK_ENABLED:true}

collabmind.ai.gemini.base-url=https://generativelanguage.googleapis.com
collabmind.ai.gemini.model=gemini-2.0-flash
collabmind.ai.gemini.api-key=${GEMINI_API_KEY:}

collabmind.ai.openai.base-url=https://api.openai.com
collabmind.ai.openai.model=${OPENAI_MODEL:gpt-5-nano}
collabmind.ai.openai.api-key=${OPENAI_API_KEY:}

management.endpoints.web.exposure.include=health,info
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=event-audit-v1
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.listener.ack-mode=record
collabmind.kafka.message-created-topic=collabmind.message-created.v1
collabmind.kafka.ai-requested-topic=collabmind.ai-requested.v1
collabmind.kafka.tool-invoked-topic=collabmind.tool-invoked.v1
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.locations=classpath:db/migration
collabmind.tools.shopping.provider=mcp
collabmind.tools.mcp-shopping.base-url=http://localhost:8085
collabmind.tools.github.provider=mcp
collabmind.tools.mcp-github.base-url=http://localhost:8085
collabmind.tools.mcp-kapruka.base-url=${KAPRUKA_TOOL_BRIDGE_URL:http://localhost:8085}



