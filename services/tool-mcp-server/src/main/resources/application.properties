spring.application.name=tool-mcp-server
server.port=8085

management.endpoints.web.exposure.include=health,info
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
collabmind.kafka.tool-invoked-topic=collabmind.tool-invoked.v1
collabmind.kapruka.mcp-url=${KAPRUKA_MCP_URL:https://mcp.kapruka.com/mcp}
collabmind.kapruka.timeout-seconds=${KAPRUKA_MCP_TIMEOUT_SECONDS:15}
